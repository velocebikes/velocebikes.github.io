name: Deploy a Hostinger

# Se ejecuta en cada push a main y también manualmente desde la pestaña "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos despliegues a la vez: si llega otro push, se espera al anterior.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Crea api/config.php con los datos de la base de datos. Este archivo
      # no está en el repositorio: sale de los secrets de GitHub y solo
      # existe en el servidor (y Hostinger no deja descargarlo).
      - name: Crear la configuración del CRM
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CRM_INITIAL_PASSWORD: ${{ secrets.CRM_INITIAL_PASSWORD }}
        run: |
          if [ -z "$DB_NAME" ]; then
            echo "::warning::Faltan los secrets de la base de datos: el CRM no funcionará en el servidor."
            exit 0
          fi
          php -r '
            $cfg = [
              "dsn" => "mysql:host=localhost;dbname=" . getenv("DB_NAME") . ";charset=utf8mb4",
              "db_user" => getenv("DB_USER"),
              "db_pass" => getenv("DB_PASSWORD"),
              "initial_password" => getenv("CRM_INITIAL_PASSWORD"),
            ];
            file_put_contents("api/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '

      # Diagnóstico temporal: qué carpetas ve el usuario FTP.
      - name: Ver carpetas del FTP
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "domains/" "domains/velocebikes.es/" "domains/velocebikes.es/public_html/"; do
            echo "== /$d"; curl -sS -m 20 --ssl-reqd --list-only -u "$U:$P" "ftp://$H/$d" 2>&1 | head -40 || true
          done
          echo "== pwd"; curl -sS -m 20 --ssl-reqd -u "$U:$P" -Q PWD "ftp://$H/" -o /dev/null -v 2>&1 | grep -i '257' || true

      - name: Subir la web por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Carpeta de destino: el usuario FTP entra en la carpeta del sitio,
          # así que public_html/ es la carpeta pública de velocebikes.es.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Archivo donde la acción recuerda qué hay subido. Nombre nuevo para
          # que vuelva a subirlo todo (la carpeta anterior no era la buena).
          state-name: .ftp-deploy-state-v2.json
          # Solo sube los archivos que han cambiado desde el último despliegue.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CNAME
            DEPLOY.md

      # Comprueba que la web y el CRM responden en el dominio real.
      - name: Comprobar la web
        run: |
          title() { grep -o '<title>[^<]*' | head -1 | sed 's/<title>//'; }
          echo "Página principal:  $(curl -sS -m 20 https://velocebikes.es/ | title)"
          echo "CRM:               $(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://velocebikes.es/crm.html)"
          if [ -f api/index.php ]; then
            echo "API + base datos:  $(curl -sS -m 20 -H 'X-CRM: 1' -H 'Content-Type: application/json' \
              -d '{"user":"prueba-despliegue","pass":"x"}' https://velocebikes.es/api/index.php?a=login | head -c 200)"
          fi
