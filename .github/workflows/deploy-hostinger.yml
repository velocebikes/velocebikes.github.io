name: Deploy a Hostinger

# Se ejecuta en cada push a main y también manualmente desde la pestaña "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dos despliegues a la vez: si llega otro push, se espera al anterior.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Crea api/config.php con los datos de la base de datos. Este archivo
      # no está en el repositorio: sale de los secrets de GitHub y solo
      # existe en el servidor (y Hostinger no deja descargarlo).
      - name: Crear la configuración del CRM
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CRM_INITIAL_PASSWORD: ${{ secrets.CRM_INITIAL_PASSWORD }}
        run: |
          if [ -z "$DB_NAME" ]; then
            echo "::warning::Faltan los secrets de la base de datos: el CRM no funcionará en el servidor."
            exit 0
          fi
          php -r '
            $cfg = [
              "dsn" => "mysql:host=localhost;dbname=" . getenv("DB_NAME") . ";charset=utf8mb4",
              "db_user" => getenv("DB_USER"),
              "db_pass" => getenv("DB_PASSWORD"),
              "initial_password" => getenv("CRM_INITIAL_PASSWORD"),
            ];
            file_put_contents("api/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
          '

      - name: Subir la web por FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Carpeta de destino en el hosting (variable de repositorio opcional).
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/velocebikes.es/public_html/' }}
          # Solo sube los archivos que han cambiado desde el último despliegue.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CNAME
            DEPLOY.md

      # Comprueba que Hostinger sirve la web y que el CRM conecta con la base
      # de datos, aunque el dominio todavía no apunte a Hostinger.
      # WEB_IP (variable) es la IP del sitio web; si no está, se usa la del FTP.
      - name: Comprobar la web en Hostinger
        env:
          IP: ${{ vars.WEB_IP || secrets.FTP_SERVER }}
        run: |
          get() { curl --resolve velocebikes.es:80:$IP -sS -m 20 "$@"; }
          title() { grep -o '<title>[^<]*' | head -1 | sed 's/<title>//'; }
          echo "Página principal:  $(get http://velocebikes.es/ | title)"
          echo "CRM:               $(get http://velocebikes.es/crm.html | title)"
          echo "API sin https:     $(get http://velocebikes.es/api/index.php?a=me | head -c 200)"
          echo "API + base datos:  $(get -H 'X-Forwarded-Proto: https' -H 'X-CRM: 1' -H 'Content-Type: application/json' \
            -d '{"user":"prueba-despliegue","pass":"x"}' http://velocebikes.es/api/index.php?a=login | head -c 200)"
